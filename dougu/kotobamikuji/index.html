<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* 古い住所（github.io）で開かれたら、新しい住所の同じページへ移す（2026年10月24日、Cloudflare Pagesへ引っ越し） */if(/\.github\.io$/.test(location.hostname)){location.replace("https://asoberu-otera.pages.dev"+location.pathname+location.search+location.hash);}</script>
<link rel="canonical" href="https://asoberu-otera.pages.dev/dougu/kotobamikuji/">
<meta name="description" content="ことばみくじ：筒をタップすると、仏教のことばの札が1枚出るおみくじ。ことば・やさしい意味・話すための問い。登録なし・無料。遊べるお寺プロジェクト">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2440">
<title>ことばみくじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* おしゃべりおみくじ v2（10/17）と同じ見た目：藍の夜に、木のおみくじ筒が一つ。引くと和紙の札が縦書きで開く。
   札には「ことば（読みがな）・やさしい意味・話すための問い」。iPadを机の真ん中に置いて回す前提。
   フォントが読めない（ネットなし）ときは、端末の明朝・ゴシックで出る */
:root {
  --ai: #1b2440;        /* 藍：地 */
  --ai-2: #253154;      /* 藍：面 */
  --ai-line: #3a4770;   /* 藍：線 */
  --mist: #d3d8e6;      /* 地の上の文字 */
  --mist-dim: #9aa3bd;  /* 控えめな文字 */
  --wood: #c08d5c;      /* 筒：正面 */
  --wood-side: #8f6038; /* 筒：側面 */
  --wood-hi: #dcae7c;   /* 筒：明るい面 */
  --washi: #f5f0e3;     /* 札の紙 */
  --sumi: #25211c;      /* 墨 */
  --sumi-2: #5f5447;    /* 薄墨：意味 */
  --shu: #c4412d;       /* 朱 */
  --font-q: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 35%, var(--ai-2) 0%, var(--ai) 70%);
  background-color: var(--ai);
  color: var(--mist);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  box-sizing: border-box;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding-inline: max(16px, 3vw);
  padding-block: 14px;
  max-width: 1100px;
  margin: 0 auto;
}
button { font-family: var(--font-ui); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--wood-hi); outline-offset: 3px; }

/* 上：名前と残り */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-q); font-size: clamp(20px, 3vw, 28px); letter-spacing: .08em; color: var(--washi); }
.brand p { margin: 0; font-size: 13px; color: var(--mist-dim); letter-spacing: .04em; }
.left { font-size: 14px; color: var(--mist); border: 1px solid var(--ai-line); border-radius: 999px; padding: 6px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.left b { color: var(--washi); font-size: 18px; }

/* 中：筒 */
.drawer { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 12px; min-height: 0; width: 100%; height: 100%; }
.tsutsu { border: 0; background: transparent; padding: 0; height: 100%; max-height: 540px; width: auto; max-width: 70vw; aspect-ratio: 3 / 4.4; position: relative; min-height: 0; }
.tsutsu svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tsutsu.shake { animation: shake .75s ease-in-out; }
@keyframes shake {
  0%,100% { transform: rotate(0); }
  15% { transform: rotate(-11deg); } 30% { transform: rotate(9deg); }
  45% { transform: rotate(-8deg); } 60% { transform: rotate(6deg); }
  75% { transform: rotate(-3deg); }
}
.stick { transition: transform .5s cubic-bezier(.2,.9,.3,1.2); transform: translateY(0); }
.tsutsu.out .stick { transform: translateY(-58px); }
.hint { margin: 0; font-size: 16px; color: var(--mist); letter-spacing: .06em; text-align: center; }
.hint.empty { color: var(--wood-hi); }

/* 下：こーせん用 */
.foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
.ghost { border: 1px solid var(--ai-line); background: transparent; color: var(--mist-dim); font-size: 13px; padding: 9px 14px; border-radius: 10px; }
.confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mist); flex-wrap: wrap; }
.confirm button { border: 0; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; }
.confirm .yes { background: var(--shu); color: var(--washi); }
.confirm .no { background: var(--ai-2); color: var(--mist); }

/* 札 */
.veil { position: fixed; inset: 0; background: rgba(12, 16, 30, .72); display: grid; place-items: center; padding: 16px; z-index: 5; }
.fuda {
  box-sizing: border-box;
  background: var(--washi);
  color: var(--sumi);
  width: min(640px, 92vw);
  height: min(80vh, 740px);
  border-radius: 6px;
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 18px 22px 18px;
  position: relative;
  transform-origin: 50% 0;
  animation: open .55s cubic-bezier(.2,.8,.2,1);
}
.fuda::before { content: ""; position: absolute; inset: 9px; border: 1.5px solid var(--shu); border-radius: 3px; pointer-events: none; opacity: .55; }
@keyframes open { from { transform: scaleY(.08); opacity: .3; } to { transform: scaleY(1); opacity: 1; } }
.fuda-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 8px 0; }
.ban { font-family: var(--font-q); font-size: 22px; color: var(--shu); letter-spacing: .14em; }
.stamp { font-family: var(--font-q); color: var(--shu); border: 2px solid var(--shu); border-radius: 4px; padding: 3px 7px; font-size: 13px; letter-spacing: .1em; line-height: 1.3; transform: rotate(-3deg); white-space: nowrap; }

/* 札の中身：縦書きで、右から「ことば → 意味 → 問い」 */
.qwrap { min-height: 0; min-width: 0; overflow: hidden; display: grid; place-items: center; padding: 10px 6px; }
.body {
  writing-mode: vertical-rl;
  inline-size: max-content;
  block-size: max-content;
  font-family: var(--font-q);
  font-size: 26px;
  white-space: nowrap;
  color: var(--sumi);
}
.body p { margin: 0; }
.kotoba {
  font-size: 2.5em;
  line-height: 1.25;
  letter-spacing: .12em;
  padding-block-start: .3em;   /* 読みがなの分（縦書きでは右） */
  margin-block-end: .3em;
}
.kotoba rt { font-size: .3em; letter-spacing: .05em; color: var(--sumi-2); }
.imi {
  font-size: .9em;
  line-height: 1.8;
  letter-spacing: .06em;
  color: var(--sumi-2);
  margin-block: .6em 1.2em;
  border-block-start: 1px solid rgba(196, 65, 45, .35);  /* ことばとのあいだの細い朱の線（縦書きでは右） */
  padding-block-start: 1em;
}
.toi {
  font-size: 1.22em;
  line-height: 1.75;
  letter-spacing: .08em;
}
.toi-label {
  display: inline-block;
  font-size: .62em;
  color: var(--shu);
  border: 1.5px solid var(--shu);
  border-radius: 3px;
  padding: .3em .12em;
  margin-block-end: .5em;   /* 縦書きでは下 */
  letter-spacing: .1em;
  line-height: 1.2;
}
.tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }

.fuda-foot { display: flex; gap: 10px; padding: 0 6px 4px; }
.fuda-foot button { flex: 1; min-width: 0; border-radius: 12px; font-size: 17px; font-weight: 700; padding: 14px 10px; letter-spacing: .04em; }
.next { border: 0; background: var(--sumi); color: var(--washi); }
.again { border: 1.5px solid var(--sumi); background: transparent; color: var(--sumi); }

@media (prefers-reduced-motion: reduce) {
  .tsutsu.shake, .fuda { animation: none; }
  .stick { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>ことばみくじ</h1>
      <p>遊べるお寺プロジェクト</p>
    </div>
    <div class="left" id="left" aria-live="polite">のこり <b id="leftNum">20</b> 本</div>
  </header>

  <main class="drawer">
    <button class="tsutsu" id="tsutsu" aria-label="ことばみくじを引く">
      <svg viewBox="0 0 300 440" aria-hidden="true">
        <defs>
          <linearGradient id="gFront" x1="0" x2="1">
            <stop offset="0" stop-color="#b9875a"/><stop offset=".5" stop-color="#cb9a69"/><stop offset="1" stop-color="#b17f52"/>
          </linearGradient>
          <linearGradient id="gStick" x1="0" x2="1">
            <stop offset="0" stop-color="#e9d3a6"/><stop offset="1" stop-color="#d1b07a"/>
          </linearGradient>
        </defs>
        <!-- 棒（引くと上に出る） -->
        <g class="stick">
          <rect x="141" y="40" width="18" height="120" rx="3" fill="url(#gStick)"/>
          <text id="stickNo" x="150" y="62" font-size="13" fill="#7a4b22" text-anchor="middle" font-family="Klee One, serif" writing-mode="tb" style="writing-mode: vertical-rl"></text>
        </g>
        <!-- 筒（六角の上面） -->
        <polygon points="70,92 110,74 190,74 230,92 190,110 110,110" fill="#6f4a2b"/>
        <ellipse cx="150" cy="92" rx="11" ry="6" fill="#2b1b10"/>
        <!-- 側面と正面 -->
        <polygon points="70,92 110,110 110,410 70,392" fill="#8f6038"/>
        <polygon points="230,92 190,110 190,410 230,392" fill="#9c6a40"/>
        <rect x="110" y="110" width="80" height="300" fill="url(#gFront)"/>
        <!-- たが -->
        <rect x="70" y="140" width="160" height="10" fill="#2f2219" opacity=".55"/>
        <rect x="70" y="360" width="160" height="10" fill="#2f2219" opacity=".55"/>
        <!-- 正面の字 -->
        <rect x="126" y="162" width="48" height="186" rx="2" fill="#f5f0e3"/>
        <text x="150" y="176" fill="#c4412d" font-size="24" font-family="Klee One, serif" writing-mode="tb" style="writing-mode: vertical-rl" text-anchor="start" letter-spacing="3">ことばみくじ</text>
        <!-- 影 -->
        <ellipse cx="150" cy="424" rx="96" ry="10" fill="#0c1020" opacity=".55"/>
      </svg>
    </button>
    <p class="hint" id="hint">筒をタップして、ことばを1つ引いてください</p>
  </main>

  <footer class="foot">
    <div id="resetArea">
      <button class="ghost" id="resetBtn">最初から</button>
    </div>
  </footer>
</div>

<div class="veil" id="veil" hidden>
  <article class="fuda" id="fuda" role="dialog" aria-modal="true" aria-labelledby="fudaBan" aria-describedby="fudaBody">
    <div class="fuda-head">
      <span class="ban" id="fudaBan">第七番</span>
      <span class="stamp">遊べるお寺</span>
    </div>
    <div class="qwrap" id="qwrap">
      <div class="body" id="fudaBody">
        <p class="kotoba" id="fudaK"></p>
        <p class="imi" id="fudaM"></p>
        <p class="toi"><span class="toi-label">問い</span><span id="fudaQ"></span></p>
      </div>
    </div>
    <div class="fuda-foot">
      <button class="again" id="againBtn">引き直す</button>
      <button class="next" id="nextBtn">つぎの人へ</button>
    </div>
  </article>
</div>

<script>
(() => {
  // ことば（ことばみくじ_v1（2026年10月25日）.md の一覧と同じ）
  // k：漢字のあとの［ ］が読みがな　m：やさしい意味　q：話すための問い　（/ は改行）
  const W = {
    1:  { k:"和[わ]顔[げん]施[せ]", m:"やさしい顔を向けることも、/ひとつのほどこし", q:"最近、だれかの笑顔に/助けられたことは？" },
    2:  { k:"有[あ]り難[がた]し", m:"めったにないこと。/「ありがとう」のもとに/なったとも言われる",q:"あたりまえすぎて、/ふだん忘れている/「ありがたい」ものは？" },
    3:  { k:"喫[きっ]茶[さ]去[こ]", m:"「まあ、お茶をどうぞ」/だれが来ても、/同じようにもてなす", q:"あなたの/「ほっとする一杯」は？" },
    4:  { k:"日[にち]日[にち]是[これ]好[こう]日[じつ]", m:"晴れの日も、雨の日も、/その日その日が、いい一日", q:"特別なことは/なかったけど、/「いい日だったなぁ」/と思った日は？" },
    5:  { k:"少[しょう]欲[よく]知[ち]足[そく]", m:"ほしがりすぎず、/いまあるもので/「足りている」と知る", q:"「これがあれば/わたしは十分」/と思えるものは？" },
    6:  { k:"愛[あい]語[ご]", m:"やさしい心から出る、/思いやりのことば", q:"最近、言われて/うれしかった/ひとことは？" },
    7:  { k:"而[に]今[こん]", m:"過ぎた日でもなく、/先の日でもなく、/いま、この時", q:"時間を忘れて/夢中になれることは？" },
    8:  { k:"看[かん]脚[きゃっ]下[か]", m:"足もとを見よ。/遠くを見る前に、/まず自分の足もとから", q:"近くにあるのに、/最近まで気づかなかった/「いいもの」は？" },
    9:  { k:"放[ほう]下[げ]著[じゃく]", m:"持っているものを、/いったん全部おろしてしまえ", q:"部屋や暮らしの中で、/思いきって/手放したいものは？" },
    10: { k:"煩[ぼん]悩[のう]", m:"心をなやませ、/みだすもの。/除夜の鐘は108回", q:"わかっちゃいるけど、/つい、やってしまう/ことは？" },
    11: { k:"明[あき]らめる", m:"「諦める」のもと。/投げ出すことではなく、/ものごとを明らかに見ること", q:"やめてみたら、/かえって楽になった/ことは？" },
    12: { k:"精[しょう]進[じん]", m:"わき目をふらず、/こつこつ努めること", q:"小さなことでも、/こつこつ続けている/ことは？" },
    13: { k:"典[てん]座[ぞ]", m:"禅寺の台所の係。/ごはんを作ることも、/大事な修行", q:"最近食べたごはんで、/「おいしかった！」/ものは？" },
    14: { k:"縁[えん]", m:"ものごとは、/いろいろなつながりが/重なって起きている", q:"いま好きなことや/やっていること。/始まったきっかけは？" },
    15: { k:"諸[しょ]行[ぎょう]無[む]常[じょう]", m:"すべては移り変わる。/同じままのものは、/ひとつもない", q:"後回しにしているけど、/ほんとうは/やってみたいことは？" },
    16: { k:"中[ちゅう]道[どう]", m:"かたよりすぎず、/ちょうどいいところを歩む", q:"「ほどほど」が/ちょうどいい、と/思うことは？" },
    17: { k:"平[びょう]常[じょう]心[しん]", m:"特別な心ではなく、/ふだんの心こそが道", q:"緊張したとき、/落ちつくために/していることは？" },
    18: { k:"冷[れい]暖[だん]自[じ]知[ち]", m:"水の冷たさ・温かさは、/飲んだ人にしかわからない", q:"やってみて、はじめて/わかったことは？" },
    19: { k:"主[しゅ]人[じん]公[こう]", m:"もとは禅のことば。/だれの中にもいる、/ほんとうの自分", q:"「自分らしいなぁ」と/思えるのは、/どんな時間？" },
    20: { k:"我[が]慢[まん]", m:"もとは「自分がえらい」と/おごる心のこと", q:"これだけはゆずれない、/小さなこだわりは？" }
  };
  const ALL = Object.keys(W).map(Number);
  const KAN = ["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
  const KEY = "kotobamikuji-1030";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let st = load() || fresh();
  let current = null; // 引いている札の番号
  let busy = false;

  function fresh() { return { left: ALL.slice() }; }
  function load() { try { const s = JSON.parse(sessionStorage.getItem(KEY)); return s && Array.isArray(s.left) ? s : null; } catch (e) { return null; } }
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const tsutsu = $("tsutsu"), hint = $("hint"), veil = $("veil"), fuda = $("fuda");

  function render() {
    $("leftNum").textContent = st.left.length;
    const empty = st.left.length === 0;
    hint.classList.toggle("empty", empty);
    hint.textContent = empty
      ? "20本ぜんぶ引きました。「最初から」で筒に戻せます"
      : "筒をタップして、ことばを1つ引いてください";
    tsutsu.setAttribute("aria-disabled", String(empty));
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  // 「/」で改行、数字は縦中横
  function linesHTML(text) {
    return text.split("/").map(line => esc(line).replace(/\d+/g, d => `<span class="tcy">${d}</span>`)).join("<br>");
  }
  // 「和[わ]顔[げん]」→ 漢字の右に読みがな
  function rubyHTML(text) {
    return esc(text).replace(/(.)\[([^\]]+)\]/g, "<ruby>$1<rt>$2</rt></ruby>");
  }

  function showFuda(n) {
    const w = W[n];
    $("fudaBan").textContent = `第${KAN[n]}番`;
    $("fudaK").innerHTML = rubyHTML(w.k);
    $("fudaM").innerHTML = linesHTML(w.m);
    $("fudaQ").innerHTML = linesHTML(w.q);
    veil.hidden = false;
    fitBody();
    fuda.style.animation = "none"; void fuda.offsetWidth; fuda.style.animation = "";
    $("nextBtn").focus();
  }

  // 札に収まるいちばん大きい字にする
  function fitBody() {
    const wrap = $("qwrap"), body = $("fudaBody");
    const maxW = wrap.clientWidth - 12, maxH = wrap.clientHeight - 20;
    let size = 42;
    body.style.fontSize = size + "px";
    while (size > 12 && (body.offsetWidth > maxW || body.offsetHeight > maxH)) { size -= 1; body.style.fontSize = size + "px"; }
  }
  addEventListener("resize", () => { if (!veil.hidden) fitBody(); });

  function pick(exclude) {
    const pool = st.left;
    const choices = pool.length > 1 && exclude ? pool.filter(x => x !== exclude) : pool;
    const n = choices[Math.floor(Math.random() * choices.length)];
    pool.splice(pool.indexOf(n), 1);
    save();
    return n;
  }

  function draw(exclude) {
    if (busy || st.left.length === 0) return;
    busy = true;
    keepAwake();
    const n = pick(exclude);
    current = n;
    $("stickNo").textContent = KAN[n];
    render();
    const done = () => { tsutsu.classList.remove("shake"); showFuda(n); busy = false; };
    if (reduce) { tsutsu.classList.add("out"); done(); return; }
    tsutsu.classList.remove("out");
    tsutsu.classList.add("shake");
    setTimeout(() => tsutsu.classList.add("out"), 650);
    setTimeout(done, 1250);
  }

  function closeFuda() {
    veil.hidden = true;
    tsutsu.classList.remove("out");
    current = null;
    render();
    tsutsu.focus();
  }

  tsutsu.addEventListener("click", () => draw());
  $("nextBtn").addEventListener("click", closeFuda);
  $("againBtn").addEventListener("click", () => {
    if (!current) return;
    const back = current;
    st.left.push(back);
    save();
    veil.hidden = true;
    tsutsu.classList.remove("out");
    current = null;
    render();
    draw(back);
  });

  // 最初から（ページの中で確かめる）
  const resetArea = $("resetArea");
  function askReset() {
    resetArea.innerHTML = "";
    const box = document.createElement("div");
    box.className = "confirm";
    box.innerHTML = '<span>全部の札を筒に戻しますか？</span><button class="yes" id="resetYes">戻す</button><button class="no" id="resetNo">やめる</button>';
    resetArea.appendChild(box);
    $("resetYes").addEventListener("click", () => { st = fresh(); save(); restoreReset(); render(); });
    $("resetNo").addEventListener("click", restoreReset);
    $("resetNo").focus();
  }
  function restoreReset() {
    resetArea.innerHTML = '<button class="ghost" id="resetBtn">最初から</button>';
    $("resetBtn").addEventListener("click", askReset);
  }
  $("resetBtn").addEventListener("click", askReset);

  document.addEventListener("keydown", e => { if (e.key === "Escape" && !veil.hidden) closeFuda(); });

  // 画面が消えないように（許されないときは何もしない）
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) { lock = null; }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lock === null && veil.hidden === false) keepAwake(); });

  render();
})();
</script>
</body>
